name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**","windows/**",".github/workflows/build-windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r windows/requirements-desktop.txt

      - name: Verify Python syntax
        run: python -m compileall -q backend windows/desktop_app.py

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name RESTO-COMMERCE windows/desktop_app.py
          $app = "dist/RESTO-COMMERCE"
          $exe = Join-Path $app "RESTO-COMMERCE.exe"
          if (!(Test-Path $exe -PathType Leaf)) {
            Get-ChildItem "dist" -Recurse | Format-Table FullName, Length
            throw "PyInstaller did not create the application executable."
          }
          $files = Get-ChildItem $app -Recurse -File
          if ($files.Count -lt 2) {
            throw "The application bundle is incomplete: support files were not collected."
          }
          Compress-Archive -Path "$app/*" -DestinationPath "dist/RESTO-COMMERCE-Windows.zip" -Force
          if (!(Test-Path "dist/RESTO-COMMERCE-Windows.zip" -PathType Leaf)) {
            throw "The Windows ZIP archive was not created."
          }

      - name: Upload Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: RESTO-COMMERCE-Windows
          path: dist/RESTO-COMMERCE-Windows.zip
          if-no-files-found: error
