name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**","windows/**",".github/workflows/build-windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r windows/requirements-desktop.txt

      - name: Verify Python syntax
        run: python -m compileall -q backend windows/desktop_app.py

      # Use onedir instead of onefile. This avoids the self-extracting PKG
      # archive that Windows reported as missing/corrupt on the user's PC.
      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name RESTO-COMMERCE windows/desktop_app.py
          if (!(Test-Path "dist/RESTO-COMMERCE/RESTO-COMMERCE.exe")) {
            throw "PyInstaller did not create the application executable."
          }
          if (!(Test-Path "dist/RESTO-COMMERCE/RESTO-COMMERCE\_internal")) {
            throw "PyInstaller support files are missing."
          }
          Compress-Archive -Path "dist/RESTO-COMMERCE/*" -DestinationPath "dist/RESTO-COMMERCE-Windows.zip" -Force

      - name: Upload Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: RESTO-COMMERCE-Windows
          path: dist/RESTO-COMMERCE-Windows.zip
          if-no-files-found: error
