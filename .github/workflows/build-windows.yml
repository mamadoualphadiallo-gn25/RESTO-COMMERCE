name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**","windows/**",".github/workflows/build-windows.yml"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r windows/requirements-desktop.txt
      - name: Verify Python syntax
        run: python -m compileall backend windows/desktop_app.py
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name RESTO-COMMERCE windows/desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RESTO-COMMERCE-Windows-EXE
          path: dist/RESTO-COMMERCE.exe
          if-no-files-found: error
